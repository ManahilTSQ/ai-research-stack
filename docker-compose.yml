version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    environment:
      # Exposes the host gateway to allow the container to reach Ollama running on the host system
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # Required for Windows and Linux Docker setups to resolve host.docker.internal to the host gateway IP
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
